[package]
name = "dsg-cli"
version = "0.1.0"
edition = "2021"
default-run = "dsg"

[[bin]]
name = "dsg"
path = "src/main.rs"

[[bin]]
name = "dsgd"
path = "src/daemon.rs"

[dependencies]
clap.workspace = true
ctrlc.workspace = true
dsg-core = { path = "../dsg-core" }
getrandom.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
shlex = "2.0.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Services", "Win32_System_Threading"] }

[dev-dependencies]
tempfile.workspace = true
