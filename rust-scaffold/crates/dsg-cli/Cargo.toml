[package]
name = "dsg-cli"
version = "0.1.0"
edition = "2021"
default-run = "dsg"

[[bin]]
name = "dsg"
path = "src/main.rs"

[[bin]]
name = "dsgd"
path = "src/daemon.rs"

[dependencies]
clap.workspace = true
ctrlc.workspace = true
dsg-core = { path = "../dsg-core" }
getrandom.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
shlex = "2.0.1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
